# Render Blueprint fuer wundermgmt.com.
#
# Zwei Services:
#   wunder-site     der alte statische Stand im Repo-Wurzelverzeichnis, haelt
#                   heute die Live-Domain und die Redirect-Liste.
#   wunder-site-v2  die neue Astro-Version aus site-v2. PREVIEW ONLY.
#                   Ansage Manuel 07.09.2026: die Seite geht NICHT auf die
#                   Hauptdomain, bevor er das finale Go gibt. Deshalb steht in
#                   diesem Block bewusst KEIN domains-Eintrag, der Service laeuft
#                   nur unter seiner eigenen onrender.com-Adresse.
services:
  - type: web
    name: wunder-site
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/video/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/styles.css
        name: Cache-Control
        value: public, max-age=300, must-revalidate
    routes:
      # Old Squarespace URLs -> new locations, so existing links and Google
      # index entries land somewhere useful instead of a 404.
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /services
        destination: /#what-we-do
      - type: redirect
        source: /story
        destination: /#about
      - type: redirect
        source: /team
        destination: /#about
      - type: redirect
        source: /call
        destination: /apply/
      - type: redirect
        source: /contact
        destination: /apply/
      - type: redirect
        source: /influencer
        destination: /
      - type: redirect
        source: /workshop
        destination: /
      - type: redirect
        source: /results-1
        destination: /results/
      - type: redirect
        source: /thank-you
        destination: /
      # Old funnel/test pages that were live in the Squarespace sitemap.
      - type: redirect
        source: /workshop-old
        destination: /
      - type: redirect
        source: /workshop-ty
        destination: /
      - type: redirect
        source: /workshop-done
        destination: /
      - type: redirect
        source: /vibe-check
        destination: /
      - type: redirect
        source: /wunder-1
        destination: /
      - type: redirect
        source: /new-page
        destination: /
      - type: redirect
        source: /test
        destination: /
      - type: redirect
        source: /freelance-photo-videographer
        destination: /
      # Ref-link redirects carried over from the old site.
      - type: redirect
        source: /onlyfans
        destination: https://onlyfans.com?ref=155121555
      - type: redirect
        source: /group
        destination: https://www.skool.com/wunder-7680/about
      # Serve the branded 404 for anything unknown. This must stay LAST:
      # rewrites only fire when no real file matches, and the page carries
      # noindex so the 200 status doesn't pollute the index.
      - type: rewrite
        source: /*
        destination: /404.html

  # ---------------------------------------------------------------------------
  # site-v2, Astro, echter Build-Schritt. Preview-Deploy, keine Custom Domain.
  # ---------------------------------------------------------------------------
  - type: web
    name: wunder-site-v2
    runtime: static
    rootDir: site-v2
    # npm ci statt npm install, damit der Build exakt gegen package-lock.json
    # baut. npm run build faehrt zuerst scripts/check-copy.mjs, ein Copy-Verstoss
    # bricht also schon den Deploy und nicht erst die Abnahme.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Ziel des Bewerbungsformulars. Leer lassen, solange kein Formulardienst
      # gewaehlt ist, dann rendert das Formular bewusst deaktiviert.
      # Empfaenger laut Ansage Manuel 07.09.2026: rg@wundermgmt.com (Ralfs).
      - key: FORM_ENDPOINT
        sync: false
      # Cookielose Statistik, optional. Leer lassen heisst kein Skript, keine
      # Einwilligungsabfrage.
      - key: PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Solange die Vorschau laeuft, soll sie nicht in den Index geraten.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /videos/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      # Dieselben alten Squarespace-URLs wie im Service oben, damit die Vorschau
      # das spaetere Verhalten eins zu eins zeigt.
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /services
        destination: /how-it-works
      - type: redirect
        source: /story
        destination: /company
      - type: redirect
        source: /team
        destination: /company
      - type: redirect
        source: /call
        destination: /apply
      - type: redirect
        source: /contact
        destination: /apply
      - type: redirect
        source: /influencer
        destination: /
      - type: redirect
        source: /workshop
        destination: /
      - type: redirect
        source: /results-1
        destination: /results
      - type: redirect
        source: /thank-you
        destination: /
      - type: redirect
        source: /workshop-old
        destination: /
      - type: redirect
        source: /workshop-ty
        destination: /
      - type: redirect
        source: /workshop-done
        destination: /
      - type: redirect
        source: /vibe-check
        destination: /apply
      - type: redirect
        source: /wunder-1
        destination: /
      - type: redirect
        source: /new-page
        destination: /
      - type: redirect
        source: /test
        destination: /
      - type: redirect
        source: /freelance-photo-videographer
        destination: /
      - type: redirect
        source: /start-1-1
        destination: /
      - type: redirect
        source: /onlyfans
        destination: https://onlyfans.com?ref=155121555
      - type: redirect
        source: /group
        destination: https://www.skool.com/wunder-7680/about
      # Muss LETZTER Eintrag bleiben, rewrites greifen nur ohne Dateitreffer.
      - type: rewrite
        source: /*
        destination: /404.html
